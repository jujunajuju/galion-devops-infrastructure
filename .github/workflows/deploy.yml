name: Terraform Multicloud Deployment

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:

  validation:
    name: Validation Terraform
    runs-on: ubuntu-latest

    steps:

      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configuration AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Initialisation Terraform
        run: terraform init

      - name: Vérification format Terraform
        run: terraform fmt -check

      - name: Validation Terraform
        run: terraform validate



  security:
    name: Analyse sécurité Checkov
    runs-on: ubuntu-latest

    needs:
      - validation

    steps:

      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation Checkov
        run: pip install checkov

      - name: Scan sécurité Terraform
        run: checkov -d . --config-file .checkov.yml



  deploy:
    name: Déploiement Terraform AWS
    runs-on: ubuntu-latest

    needs:
      - validation
      - security
    
    outputs:
      ec2_ip: ${{ steps.terraform_output.outputs.ec2_ip }}

    steps:

      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configuration AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Initialisation Terraform
        run: terraform init

      - name: Déploiement Terraform
        run: terraform apply -auto-approve
      
      - name: Récupération IP EC2
        id: terraform_output
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT



  ansible:
    name: Configuration Ansible
    runs-on: ubuntu-latest

    needs:
      - deploy

    steps:

      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation Ansible
        run: |
          sudo apt update
          sudo apt install ansible -y

      - name: Configuration clé SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/galion-devops-key.pem
          chmod 400 ~/.ssh/galion-devops-key.pem
          ssh-keygen -y -f ~/.ssh/galion-devops-key.pem > /dev/null

      - name: Mise à jour inventaire Ansible
        working-directory: ansible
        run: |
          echo "[webserver]" > inventory.ini
          echo "${{ needs.deploy.outputs.ec2_ip }}" >> inventory.ini
          echo "" >> inventory.ini
          echo "[webserver:vars]" >> inventory.ini
          echo "ansible_user=ec2-user" >> inventory.ini
          echo "ansible_ssh_private_key_file=~/.ssh/galion-devops-key.pem" >> inventory.ini


      - name: Déploiement configuration Ansible
        working-directory: ansible
        run: |
          ansible-playbook playbook.yml



  tests:
    name: Tests du déploiement
    runs-on: ubuntu-latest

    needs:
      - ansible

    steps:

      - name: Test accessibilité serveur web
        run: |
          curl -f http://${{ needs.deploy.outputs.ec2_ip }}

      - name: Vérification contenu page web
        run: |
          curl -f http://${{ needs.deploy.outputs.ec2_ip }} | grep "Galion DevOps"



  notification:
    name: Rapport consolidé déploiement
    runs-on: ubuntu-latest

    needs:
      - validation
      - security
      - deploy
      - ansible
      - tests

    if: always()

    steps:

      - name: Génération du rapport final
        run: |

          echo "# 🚀 Galion DevOps Deployment Report" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Pipeline Results" >> $GITHUB_STEP_SUMMARY

          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Validation | ${{ needs.validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Checkov Scan | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform AWS Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ansible Configuration | ${{ needs.ansible.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment Tests | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Infrastructure" >> $GITHUB_STEP_SUMMARY

          echo "- ☁️ AWS EC2" >> $GITHUB_STEP_SUMMARY
          echo "- 🐧 Amazon Linux 2023" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Apache Web Server" >> $GITHUB_STEP_SUMMARY
          echo "- 🏗️ Terraform" >> $GITHUB_STEP_SUMMARY
          echo "- ⚙️ Ansible" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Final Status" >> $GITHUB_STEP_SUMMARY

          echo "Deployment pipeline completed." >> $GITHUB_STEP_SUMMARY

            