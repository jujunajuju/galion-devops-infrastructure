---
- name: Install Apache web server
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Start Apache service
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: yes

- name: Deploy website files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/www/html/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - index.html
    - style.css
    - script.js

- name: Restart Apache service
  ansible.builtin.service:
    name: httpd
    state: restarted